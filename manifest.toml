#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "rpimon"
name = "rpimon"
description.en = "Lightweight Raspberry Pi monitoring: temperature, CPU, RAM, disk, network, power"
description.fr = "Monitoring léger du Raspberry Pi : température, CPU, RAM, disque, réseau, alimentation"

version = "1.2.1~ynh1"

maintainers = ["Isilin"]

[upstream]
license = "MIT"
code = "https://github.com/Isilin/rpimon_ynh"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "50M"
ram.build = "50M"
ram.runtime = "30M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/rpimon"

    [install.init_main_permission]
    # Les métriques du serveur ne doivent pas être publiques
    type = "group"
    default = "admins"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    # rpimon.db (~9 Mo en régime établi) et archives/ (anciens relevés importés)

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8095
