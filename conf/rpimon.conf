# Configuration de rpimon - générée par le paquet YunoHost, ne pas modifier à la main.
# Pour changer la rétention ou l'intervalle (exemple) :
#   sudo yunohost app setting rpimon raw_days -v 14
#   sudo yunohost app upgrade rpimon --force

[storage]
db = __DATA_DIR__/rpimon.db
# mesures brutes (1 point / intervalle) : jours conservés (minimum 2)
raw_days = __RAW_DAYS__
# agrégats horaires (moyenne/min/max) : jours conservés, 0 = indéfiniment
hourly_days = __HOURLY_DAYS__
# agrégats journaliers : jours conservés, 0 = indéfiniment
daily_days = __DAILY_DAYS__

[collect]
# secondes entre deux mesures (minimum 10)
interval = __INTERVAL__
# disque suivi pour les E/S (mmcblk0 = carte SD, sda = SSD USB) ; auto = celui qui porte "mount"
disk = auto
mount = /
# interfaces réseau additionnées, séparées par des espaces ; auto = eth*, en*, wl*, usb*
net = auto

[web]
enabled = yes
# reste sur 127.0.0.1 : l'accès passe par nginx et le SSO YunoHost
listen = 127.0.0.1
port = __PORT__
